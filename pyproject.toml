[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mango-disease-ai"
version = "0.1.3"
description = "AI-powered Amropali mango disease detection: classify 7 diseases, generate Grad-CAM heatmaps, and produce PDF reports."
readme = "README_PACKAGE.md"
license = "MIT"
requires-python = ">=3.10"

authors = [
    { name = "AIUB R&D ICCA Research Group" }
]

keywords = [
    "mango",
    "disease",
    "detection",
    "deep-learning",
    "plant-disease",
    "grad-cam",
    "efficientnet",
    "agriculture",
    "amropali",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core runtime dependencies
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.11.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
# For running the public API server
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]
# For development and testing
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",       # FastAPI test client
    "build>=1.2.0",        # PyPI build tool
    "twine>=5.0.0",        # PyPI upload tool
]

[project.scripts]
# After `pip install mango-disease-ai[api]`, this command becomes available globally:
#   mango-api          <- starts server on port 8000
#   mango-api --port 8080
#   mango-api --help
mango-api = "mango_disease_ai.server:main"

[project.urls]
"Homepage" = "https://github.com/aiub-rd-icca/mango-disease-ai"
"Bug Tracker" = "https://github.com/aiub-rd-icca/mango-disease-ai/issues"
"Research Group" = "https://aiub.edu"

[tool.setuptools.packages.find]
where = ["."]
include = ["mango_disease_ai*"]

[tool.setuptools.package-data]
# Include model weights AND the docs website HTML bundled inside the package
mango_disease_ai = ["*.pt", "*.pth", "*.py", "*.html", "*.json", "fonts/*.ttf", "fonts/*.txt"]

